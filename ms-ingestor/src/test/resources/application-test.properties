logging.file.name=${LOG}/ingestor.log

server.port=8086
spring.data.mongodb.host=127.0.0.1
spring.data.mongodb.port=27017
#spring.data.mongodb.authentication-database=admin
#spring.data.mongodb.username=<username specified on MONGO_INITDB_ROOT_USERNAME>
#spring.data.mongodb.password=<password specified on MONGO_INITDB_ROOT_PASSWORD>
spring.data.mongodb.database=systechlist

spring.batch.jdbc.initialize-schema=always
spring.batch.job.enabled=true
batch.size=1000
batch.cron=* * */5 * * *

providers.list=SY

download.src=ftp://SMG:$SMG605@ftplocal.systechsa.com/LISTAS_CSV.zip
download.dst=c:/$/LISTAS_CSV.zip
mapping.WC.src-file=c:/$/wc-short.txt
mapping.WC.name=world-check
mapping.WC.delimiter=|
mapping.WC.quote="
mapping.WC.null=NULL

mapping.WC.fields=age:Age,\
	age_date:AgeDate,\
	aliases:Aliases,\
	alternative_spellings:AlternativeSpelling,\
	category:Category,\
	companies:Companies,\
	countries:Countries,\
	deceased:Deceased,\
	deprecated_since:F_BAJA,\
	dob:DOB,\
	e_i:E_I,\
	editor:Editor,\
	entered:Entered,\
	updated:Updated,\
	external_sources:ExternalSources,\
	further_information:FurtherInformation,\
	ssn:SSN,\
	passports:Passports,\
	keywords:Keywords,\
	linked_to:LinkedTo,\
	locations:Locations,\
	firstname:FirstName,\
	lastname:LastName,\
	pob:POB,\
	social_position:SocialPosition,\
	subcategory:SubCategory,\
	title:Title,\
	ui:UI
        
mapping.SY.src-file=c:/$/LISTAS_CSV/TB_WC_RECORDS.txt
mapping.SY.name=systech
mapping.SY.delimiter=;
mapping.SY.quote="
mapping.SY.null=-
mapping.SY.errors.ignore=true
mapping.SY.errors.max=20
mapping.SY.fields=\
	aliases:Aliases,\
	alternative_spellings:AlternativeSpelling,\
	category:Category,\
	companies:companies,\
	countries:countries,\
	deceased:deceased,\
	deprecated_since:DateDeleted,\
	dob:DOB,\
	e_i:E_I,\
	editor:editor,\
	entered:entered:MMM dd yyyy hhmm:ENGLISH,\
	external_sources:ExternalSources,\
	further_information:FurtherInformation,\
	ssn:SSN,\
	passports:passports,\
	keywords:keywords,\
	linked_to:linkedto,\
	locations:Locations,\
	firstname:FirstName,\
	lastname:LastName,\
	pob:POB,\
	social_position:SocialPosition,\
	subcategory:SubCategory,\
	title:Title,\
	updated:updated:MMM dd yyyy hhmm:ENGLISH,\
	ui:UI


index.folder=c:/$listasfiles/lucene-index
matcher.stopwords-file=c:/$listas/stopwords/stopwords.txt

